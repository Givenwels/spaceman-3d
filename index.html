<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>太空人 · 赛博穿越</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:100%; height:100%; background:#000; overflow:hidden; cursor:none; }
  #c { position:fixed; inset:0; display:block; }
  #cursor {
    position:fixed; top:0; left:0; width:26px; height:26px; margin:-13px 0 0 -13px;
    border:1px solid rgba(120,255,210,.6); border-radius:50%; pointer-events:none;
    z-index:30; transition:width .25s, height .25s, border-color .25s; mix-blend-mode:screen;
  }
  #cursor::after{ content:''; position:absolute; inset:11px; background:#7affd2; border-radius:50%; }
  .ui { position:fixed; z-index:20; color:#eafff5; font-family:'Space Grotesk',-apple-system,'Segoe UI',sans-serif;
        pointer-events:none; mix-blend-mode:exclusion; }
  #brand { top:26px; left:32px; font-size:22px; font-weight:700; letter-spacing:.28em; }
  #tag   { top:54px; left:32px; font-size:11px; letter-spacing:.32em; opacity:.5; }
  #title { left:0; right:0; top:50%; transform:translateY(-50%); text-align:center;
           font-size:clamp(28px,6vw,86px); font-weight:600; line-height:1.05;
           text-shadow:0 0 40px rgba(60,255,200,.25); }
  #title small{ display:block; font-size:.28em; letter-spacing:.5em; opacity:.45;
                font-weight:400; margin-top:18px; }
  #hint { bottom:30px; left:0; right:0; text-align:center; font-size:11px;
          letter-spacing:.32em; opacity:.45; }
  #hint b{ display:inline-block; width:1px; height:34px; background:#7affd2;
           vertical-align:middle; margin-left:14px; opacity:.6;
           animation:p 1.8s ease-in-out infinite; }
  @keyframes p{ 0%,100%{transform:scaleY(.4);opacity:.3} 50%{transform:scaleY(1);opacity:.8} }
  #load { position:fixed; inset:0; background:#000; z-index:50; display:flex;
          align-items:center; justify-content:center; color:#7affd2;
          font-family:monospace; font-size:13px; letter-spacing:.3em;
          transition:opacity .8s; }
  #load.hide{ opacity:0; pointer-events:none; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://esm.sh/three@0.160.0",
    "three/addons/": "https://esm.sh/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<canvas id="c"></canvas>
<div id="cursor"></div>
<div id="brand" class="ui">LUSION</div>
<div id="tag" class="ui">太空人 · SPATIAL DRIFT</div>
<div id="title" class="ui">穿越数据之境<small>STEP INTO A NEW WORLD</small></div>
<div id="hint" class="ui">移动鼠标 · 滚动加速<b></b></div>
<div id="load">LOADING&nbsp;&nbsp;<span id="lp">0</span>%</div>

<script type="importmap">
{ "imports": {
  "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
  "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
}}
</script>

<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias:true, powerPreference:'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x000000, 1);

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x000208, 0.012);

const camera = new THREE.PerspectiveCamera(70, innerWidth/innerHeight, 0.1, 600);
camera.position.set(0, 0, 0);

// ---------- lights ----------
scene.add(new THREE.AmbientLight(0x2a3d4d, 0.7));
const keyLight = new THREE.PointLight(0x9fe8ff, 2.0, 90);
scene.add(keyLight);
const rimLight = new THREE.PointLight(0x4dffb0, 1.4, 70);
scene.add(rimLight);

// ---------- tunnel constants ----------
const SEG = 26;          // number of segments
const SEG_LEN = 24;      // length of each segment along z
const TUN_LEN = SEG * SEG_LEN;
const COLORS = [0x39ff9d, 0x1fe6ff, 0xffe14d, 0xeafff5, 0x7c5cff];

// ---------- pillars (instanced) ----------
const pillarGeo = new THREE.BoxGeometry(1, 1, 1);
const pillarMat = new THREE.MeshStandardMaterial({
  color:0x05080d, roughness:0.55, metalness:0.7,
  emissive:0x05131a, emissiveIntensity:0.6
});
const PILLAR_N = SEG * 4;
const pillars = new THREE.InstancedMesh(pillarGeo, pillarMat, PILLAR_N);
const dummy = new THREE.Object3D();
let pi = 0;
for (let s = 0; s < SEG; s++) {
  const z = -s * SEG_LEN;
  // two pillars per side
  const xs = [-13, -9, 9, 13];
  for (let k = 0; k < 4; k++) {
    dummy.position.set(xs[k] + (Math.random()-0.5)*1.5, (Math.random()-0.5)*2, z + (Math.random()-0.5)*4);
    dummy.scale.set(1.4 + Math.random()*1.6, 14 + Math.random()*5, 1.4 + Math.random()*1.6);
    dummy.rotation.set(0, 0, 0);
    dummy.updateMatrix();
    pillars.setMatrixAt(pi++, dummy.matrix);
  }
}
scene.add(pillars);

// ---------- glowing data blocks (instanced + per-instance color) ----------
const blockGeo = new THREE.PlaneGeometry(1, 1);
const blockMat = new THREE.MeshBasicMaterial({ transparent:true, opacity:0.95,
  blending:THREE.AdditiveBlending, side:THREE.DoubleSide, depthWrite:false });
const BLOCK_N = 520;
const blocks = new THREE.InstancedMesh(blockGeo, blockMat, BLOCK_N);
const blockData = [];
const col = new THREE.Color();
for (let i = 0; i < BLOCK_N; i++) {
  const z = -Math.random() * TUN_LEN;
  const ang = Math.random() * Math.PI * 2;
  const rad = 3 + Math.random() * 11;
  const x = Math.cos(ang) * rad;
  const y = Math.sin(ang) * rad * 0.7;
  const w = 0.4 + Math.random() * 3.4;
  const h = 0.25 + Math.random() * 1.3;
  const c = COLORS[(Math.random()*COLORS.length)|0];
  blockData.push({ x, y, z, w, h, rx:(Math.random()-.5)*0.6, ry:(Math.random()-.5)*0.6,
                   tw: Math.random()*Math.PI*2, ts: 1 + Math.random()*2 });
  col.set(c);
  blocks.setColorAt(i, col);
}
scene.add(blocks);

// ---------- code rain (instanced thin streaks) ----------
const rainGeo = new THREE.PlaneGeometry(0.06, 1);
const rainMat = new THREE.MeshBasicMaterial({ color:0x35ff9b, transparent:true,
  opacity:0.55, blending:THREE.AdditiveBlending, depthWrite:false });
const RAIN_N = 260;
const rain = new THREE.InstancedMesh(rainGeo, rainMat, RAIN_N);
const rainData = [];
for (let i = 0; i < RAIN_N; i++) {
  rainData.push({
    x:(Math.random()-0.5)*30, y:Math.random()*30-6,
    z:-Math.random()*TUN_LEN, len:2+Math.random()*6,
    spd:6+Math.random()*16
  });
}
scene.add(rain);

// ---------- floor & ceiling grid ----------
function makeGrid(y, color) {
  const g = new THREE.Group();
  const mat = new THREE.LineBasicMaterial({ color, transparent:true, opacity:0.32 });
  const pts = [];
  const W = 16, L = TUN_LEN;
  for (let x = -W; x <= W; x += 2) { pts.push(x,y,0, x,y,-L); }
  for (let z = 0; z >= -L; z -= 4) { pts.push(-W,y,z, W,y,z); }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(pts, 3));
  g.add(new THREE.LineSegments(geo, mat));
  return g;
}
const floor = makeGrid(-7.5, 0x0c5a3a);
const ceil  = makeGrid( 7.5, 0x0a3f55);
scene.add(floor, ceil);

// ---------- astronaut (procedural from primitives) ----------
function buildAstronaut(scale, ghost) {
  const g = new THREE.Group();
  const suit = new THREE.MeshStandardMaterial({
    color:0xdfe9ee, roughness:0.42, metalness:0.25,
    transparent:true, opacity: ghost ? 0.55 : 0.92,
    emissive:0x16313a, emissiveIntensity:0.5
  });
  const visor = new THREE.MeshStandardMaterial({
    color:0x07141c, roughness:0.08, metalness:1.0,
    emissive:0x1ec8ff, emissiveIntensity:0.7,
    transparent:true, opacity:0.95
  });
  // torso
  const torso = new THREE.Mesh(new THREE.CapsuleGeometry(0.62, 0.95, 6, 14), suit);
  g.add(torso);
  // backpack
  const pack = new THREE.Mesh(new THREE.BoxGeometry(1.0, 1.15, 0.55), suit);
  pack.position.set(0, 0.05, -0.6); g.add(pack);
  // helmet
  const helmet = new THREE.Mesh(new THREE.SphereGeometry(0.62, 26, 26), suit);
  helmet.position.y = 1.18; g.add(helmet);
  const vis = new THREE.Mesh(new THREE.SphereGeometry(0.5, 24, 24,
    -0.6, 1.2, 0.55, 1.6), visor);
  vis.position.set(0, 1.16, 0.18); g.add(vis);
  // limbs
  const limb = (len) => new THREE.Mesh(new THREE.CapsuleGeometry(0.21, len, 5, 10), suit);
  const armL = limb(1.0); armL.position.set(-0.86, 0.15, 0); armL.rotation.z =  0.55; g.add(armL);
  const armR = limb(1.0); armR.position.set( 0.86, 0.15, 0); armR.rotation.z = -0.55; g.add(armR);
  const legL = limb(1.15); legL.position.set(-0.32, -1.25, 0); legL.rotation.z =  0.18; g.add(legL);
  const legR = limb(1.15); legR.position.set( 0.32, -1.25, 0); legR.rotation.z = -0.18; g.add(legR);
  // glow halo for bloom
  const halo = new THREE.Mesh(new THREE.SphereGeometry(2.1, 18, 18),
    new THREE.MeshBasicMaterial({ color:0x7fffe0, transparent:true, opacity:0.06,
      blending:THREE.AdditiveBlending, depthWrite:false }));
  g.add(halo);
  g.scale.setScalar(scale);
  return g;
}
// hero = pivot group so model tumbles around its own center
const hero = new THREE.Group();
scene.add(hero);
const heroGlow = new THREE.Mesh(new THREE.SphereGeometry(2.4, 20, 20),
  new THREE.MeshBasicMaterial({ color:0x8fffe6, transparent:true, opacity:0.07,
    blending:THREE.AdditiveBlending, depthWrite:false }));
hero.add(heroGlow);

const farAstros = [];
for (let i = 0; i < 3; i++) {
  const grp = new THREE.Group();
  grp.userData = {
    z:-40 - i*70 - Math.random()*40,
    x:(Math.random()-0.5)*16, y:(Math.random()-0.5)*8,
    sp:0.4 + Math.random()*0.5, ph:Math.random()*Math.PI*2
  };
  scene.add(grp); farAstros.push(grp);
}

// fit any astronaut object to a target height, recentered at origin
function normalizeAstronaut(obj, targetH) {
  const box = new THREE.Box3().setFromObject(obj);
  const size = new THREE.Vector3(); box.getSize(size);
  const center = new THREE.Vector3(); box.getCenter(center);
  obj.position.sub(center);
  const s = targetH / (size.y || 1);
  const wrap = new THREE.Group();
  wrap.add(obj);
  wrap.scale.setScalar(s);
  return wrap;
}

// ---------- holographic ghost shader (THE Lusion look) ----------
// fresnel rim glow + translucent core + scan lines + digital flicker
const ghostMats = [];
function makeGhostMaterial(opts = {}) {
  const m = new THREE.ShaderMaterial({
    transparent: true,
    depthWrite: false,
    blending: THREE.AdditiveBlending,
    side: THREE.DoubleSide,
    uniforms: {
      uTime:  { value: 0 },
      uRim:   { value: new THREE.Color(opts.rim   || 0x9ffff0) },
      uCore:  { value: new THREE.Color(opts.core  || 0x123a44) },
      uPower: { value: opts.power ?? 2.4 },
      uAlpha: { value: opts.alpha ?? 0.85 }
    },
    vertexShader: `
      varying vec3 vN; varying vec3 vView; varying vec3 vWorld;
      void main(){
        vec4 wp = modelMatrix * vec4(position,1.0);
        vWorld = wp.xyz;
        vN = normalize(mat3(modelMatrix) * normal);
        vView = normalize(cameraPosition - wp.xyz);
        gl_Position = projectionMatrix * viewMatrix * wp;
      }`,
    fragmentShader: `
      varying vec3 vN; varying vec3 vView; varying vec3 vWorld;
      uniform float uTime,uPower,uAlpha;
      uniform vec3 uRim,uCore;
      void main(){
        float f = pow(1.0 - clamp(dot(normalize(vView), normalize(vN)), 0.0, 1.0), uPower);
        // horizontal scan lines travelling upward
        float scan = 0.5 + 0.5 * sin(vWorld.y * 14.0 - uTime * 6.0);
        scan = 0.65 + 0.35 * scan;
        // subtle global flicker
        float flick = 0.92 + 0.08 * sin(uTime * 28.0);
        vec3 col = mix(uCore, uRim, f);
        col += uRim * f * 1.6;          // hot rim for bloom to catch
        col *= scan * flick;
        float a = (uAlpha * (0.22 + f * 1.1)) * scan;
        gl_FragColor = vec4(col, a);
      }`
  });
  ghostMats.push(m);
  return m;
}

function applyGhost(root, opts) {
  root.traverse((o) => {
    if (o.isMesh) o.material = makeGhostMaterial(opts);
  });
}

// try to load a real astronaut model; fall back to procedural if offline
const ASTRO_URL = 'https://modelviewer.dev/shared-assets/models/Astronaut.glb';
let astronautReady = false;
new GLTFLoader().load(
  ASTRO_URL,
  (gltf) => {
    const src = gltf.scene;
    const heroModel = normalizeAstronaut(src.clone(true), 4.6);
    applyGhost(heroModel, { rim:0xaffff2, core:0x10323c, power:2.2, alpha:0.95 });
    hero.add(heroModel);
    farAstros.forEach(() => {});
    farAstros.forEach((grp) => {
      const c = normalizeAstronaut(src.clone(true), 4.6);
      c.scale.multiplyScalar(0.5 + Math.random() * 0.4);
      applyGhost(c, { rim:0x6fe9ff, core:0x0a2630, power:3.0, alpha:0.6 });
      grp.add(c);
    });
    astronautReady = true;
  },
  undefined,
  () => {
    // offline / blocked -> procedural fallback, still ghosted
    const h = buildAstronaut(1.0, false); applyGhost(h, { rim:0xaffff2, core:0x10323c });
    hero.add(h);
    farAstros.forEach((grp) => {
      const a = buildAstronaut(0.55 + Math.random() * 0.4, true);
      applyGhost(a, { rim:0x6fe9ff, core:0x0a2630, alpha:0.55 });
      grp.add(a);
    });
    astronautReady = true;
  }
);

// ---------- ripple post shader (mouse water) ----------
const RippleShader = {
  uniforms: {
    tDiffuse:{ value:null }, uTime:{ value:0 },
    uMouse:{ value:new THREE.Vector2(0.5,0.5) },
    uAmp:{ value:0 }, uAspect:{ value:innerWidth/innerHeight }
  },
  vertexShader: `varying vec2 vUv; void main(){ vUv=uv;
    gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
  fragmentShader: `
    varying vec2 vUv; uniform sampler2D tDiffuse;
    uniform float uTime,uAmp,uAspect; uniform vec2 uMouse;
    void main(){
      vec2 uv=vUv; vec2 d=uv-uMouse; d.x*=uAspect;
      float dist=length(d);
      float wave=sin(dist*42.0 - uTime*9.0);
      float decay=exp(-dist*5.5);
      float amp=wave*decay*uAmp*0.016;
      vec2 dir = dist>0.0001? normalize(d) : vec2(0.0);
      vec2 off = dir*amp;
      float ca = amp*0.7;
      vec3 c;
      c.r = texture2D(tDiffuse, uv+off+dir*ca).r;
      c.g = texture2D(tDiffuse, uv+off).g;
      c.b = texture2D(tDiffuse, uv+off-dir*ca).b;
      gl_FragColor = vec4(c,1.0);
    }`
};

const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 1.35, 0.7, 0.08);
composer.addPass(bloom);
const ripple = new ShaderPass(RippleShader);
ripple.renderToScreen = true;
composer.addPass(ripple);

// ---------- interaction ----------
let mx = 0.5, my = 0.5, tmx = 0.5, tmy = 0.5, rippleAmp = 0;
let speed = 26, targetSpeed = 26;
const cur = document.getElementById('cursor');
addEventListener('mousemove', e => {
  tmx = e.clientX / innerWidth;
  tmy = e.clientY / innerHeight;
  rippleAmp = Math.min(rippleAmp + 0.16, 1);
  cur.style.transform = `translate(${e.clientX}px,${e.clientY}px)`;
}, { passive:true });
addEventListener('wheel', e => {
  targetSpeed = Math.max(14, Math.min(95, targetSpeed + (e.deltaY>0 ? 14 : -14)));
}, { passive:true });
addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  composer.setSize(innerWidth, innerHeight);
  ripple.uniforms.uAspect.value = innerWidth/innerHeight;
});

// ---------- animation ----------
const clock = new THREE.Clock();
const tmp = new THREE.Object3D();

function frame() {
  requestAnimationFrame(frame);
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.elapsedTime;

  // smooth input
  mx += (tmx - mx) * 0.06;
  my += (tmy - my) * 0.06;
  speed += (targetSpeed - speed) * 0.04;
  targetSpeed += (26 - targetSpeed) * 0.012;     // ease back to cruise
  rippleAmp *= 0.94;

  // forward flight (穿越)
  camera.position.z -= speed * dt;
  camera.position.x += ((mx - 0.5) * 7 - camera.position.x) * 0.05;
  camera.position.y += ((0.5 - my) * 5 - camera.position.y) * 0.05;
  camera.lookAt(
    (mx - 0.5) * 6,
    (0.5 - my) * 4,
    camera.position.z - 30
  );
  camera.rotation.z = (mx - 0.5) * 0.07;

  keyLight.position.set(camera.position.x+4, camera.position.y+5, camera.position.z-8);
  rimLight.position.set(camera.position.x-6, camera.position.y-3, camera.position.z-18);

  const camZ = camera.position.z;

  // recycle pillars
  pillars.getMatrixAt(0, tmp.matrix);
  for (let i = 0; i < PILLAR_N; i++) {
    pillars.getMatrixAt(i, tmp.matrix);
    tmp.matrix.decompose(tmp.position, tmp.quaternion, tmp.scale);
    if (tmp.position.z > camZ + SEG_LEN) {
      tmp.position.z -= TUN_LEN;
      tmp.updateMatrix();
      pillars.setMatrixAt(i, tmp.matrix);
    }
  }
  pillars.instanceMatrix.needsUpdate = true;

  // data blocks: spin + recycle
  for (let i = 0; i < BLOCK_N; i++) {
    const b = blockData[i];
    if (b.z > camZ + 8) b.z -= TUN_LEN;
    const pulse = 0.85 + Math.sin(t * b.ts + b.tw) * 0.15;
    tmp.position.set(b.x, b.y, b.z);
    tmp.rotation.set(b.rx + t*0.1, b.ry + t*0.12, 0);
    tmp.scale.set(b.w * pulse, b.h * pulse, 1);
    tmp.updateMatrix();
    blocks.setMatrixAt(i, tmp.matrix);
  }
  blocks.instanceMatrix.needsUpdate = true;

  // code rain: fall + recycle
  for (let i = 0; i < RAIN_N; i++) {
    const r = rainData[i];
    r.y -= r.spd * dt;
    if (r.y < -16) { r.y = 18; r.z = camZ - Math.random()*TUN_LEN; r.x=(Math.random()-0.5)*30; }
    if (r.z > camZ + 8) r.z -= TUN_LEN;
    tmp.position.set(r.x, r.y, r.z);
    tmp.rotation.set(0,0,0);
    tmp.scale.set(1, r.len, 1);
    tmp.updateMatrix();
    rain.setMatrixAt(i, tmp.matrix);
  }
  rain.instanceMatrix.needsUpdate = true;

  // grids snap-follow camera (infinite illusion)
  const snap = Math.round(camZ / 4) * 4;
  floor.position.z = snap; ceil.position.z = snap;

  // hero astronaut: float ahead, tumble, drift
  hero.position.set(
    Math.sin(t*0.45)*3.2 + (mx-0.5)*2,
    Math.cos(t*0.37)*1.8 + (0.5-my)*1.5,
    camZ - 26
  );
  hero.rotation.x = t*0.32;
  hero.rotation.y = t*0.24;
  hero.rotation.z = Math.sin(t*0.3)*0.4;

  // far astronauts
  for (const a of farAstros) {
    const u = a.userData;
    if (u.z > camZ + 6) u.z -= TUN_LEN;
    a.position.set(
      u.x + Math.sin(t*u.sp + u.ph)*4,
      u.y + Math.cos(t*u.sp*0.8 + u.ph)*3,
      u.z
    );
    a.rotation.x = t*u.sp*0.6;
    a.rotation.y = t*u.sp*0.5;
  }

  // ghost shader time
  for (let i = 0; i < ghostMats.length; i++) ghostMats[i].uniforms.uTime.value = t;

  // ripple uniforms
  ripple.uniforms.uTime.value = t;
  ripple.uniforms.uAmp.value = rippleAmp;
  ripple.uniforms.uMouse.value.set(mx, 1 - my);

  composer.render();
}

// ---------- fake loader then start ----------
const lp = document.getElementById('lp');
const loadEl = document.getElementById('load');
let p = 0;
const li = setInterval(() => {
  p = Math.min(100, p + 4 + Math.random()*9);
  lp.textContent = Math.floor(p);
  if (p >= 100) {
    clearInterval(li);
    loadEl.classList.add('hide');
    clock.start();
    frame();
  }
}, 70);
</script>
</body>
</html>
